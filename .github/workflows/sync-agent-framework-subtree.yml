# .github/workflows/sync-agent-framework-subtree.yml

name: Sync agent-framework subtree

on:
  schedule:
    - cron: '0 6 * * 0'        # runs every Sunday at 6 AM UTC
  workflow_dispatch:             # lets you trigger it manually anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Disable LFS entirely
        run: |
          git lfs install --skip-smudge
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"
          git lfs uninstall
          git config --global lfs.allowincompletepush true

      - name: Add or pull subtree
        run: |
          REMOTE_NAME="upstream-agent-framework"
          REMOTE_URL="https://github.com/microsoft/agent-framework.git"
          FOLDER="agent-framework"
          BRANCH="main"

          # Add the upstream remote (ignore error if it already exists)
          git remote add "$REMOTE_NAME" "$REMOTE_URL" 2>/dev/null || true
          git fetch "$REMOTE_NAME" "$BRANCH"

          if [ -d "$FOLDER" ]; then
            echo "::notice::Subtree folder exists — pulling upstream changes…"
            git subtree pull \
              --prefix="$FOLDER" \
              "$REMOTE_NAME" "$BRANCH" \
              --squash \
              -m "chore: sync agent-framework @ $(date -u +%Y-%m-%d)"
          else
            echo "::notice::Subtree folder not found — performing initial add…"
            git subtree add \
              --prefix="$FOLDER" \
              "$REMOTE_NAME" "$BRANCH" \
              --squash
          fi

      - name: Remove LFS tracking from subtree
        run: |
          FOLDER="agent-framework"

          # Remove filter=lfs lines from any .gitattributes in the subtree
          find "$FOLDER" -name ".gitattributes" -exec sed -i '/filter=lfs/d' {} \;

          # Also handle the root .gitattributes if it exists
          if [ -f .gitattributes ]; then
            sed -i '/filter=lfs/d' .gitattributes
          fi

          # Untrack all LFS patterns globally in this repo
          git lfs untrack "*.png" 2>/dev/null || true
          git lfs untrack "*.jpg" 2>/dev/null || true
          git lfs untrack "*.jpeg" 2>/dev/null || true
          git lfs untrack "*.gif" 2>/dev/null || true
          git lfs untrack "*.pdf" 2>/dev/null || true

          # Find all LFS pointer files in the subtree and re-add them as regular files
          # LFS pointers are small text files starting with "version https://git-lfs"
          find "$FOLDER" -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.pdf" \) | while read -r file; do
            if head -1 "$file" 2>/dev/null | grep -q "^version https://git-lfs"; then
              echo "Removing LFS pointer file: $file"
              git rm --cached "$file" 2>/dev/null || true
              rm -f "$file"
            fi
          done

          # Stage all changes
          git add -A

          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove LFS tracking from agent-framework subtree"
          fi

      - name: Push changes
        run: |
          if git diff --quiet origin/main..HEAD; then
            echo "::notice::No new upstream changes — nothing to push."
          else
            git push origin main
          fi
