# .github/workflows/sync-agent-framework-subtree.yml

name: Sync agent-framework subtree

on:
  schedule:
    - cron: '0 6 * * 0'        # runs every Sunday at 6 AM UTC
  workflow_dispatch:             # lets you trigger it manually anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Completely disable LFS
        run: |
          git lfs uninstall
          git config --global filter.lfs.smudge "cat"
          git config --global filter.lfs.clean "cat"
          git config --global filter.lfs.process ""
          git config --global filter.lfs.required false

      - name: Add or pull subtree
        run: |
          REMOTE_NAME="upstream-agent-framework"
          REMOTE_URL="https://github.com/microsoft/agent-framework.git"
          FOLDER="agent-framework"
          BRANCH="main"

          git remote add "$REMOTE_NAME" "$REMOTE_URL" 2>/dev/null || true
          git fetch "$REMOTE_NAME" "$BRANCH"

          if [ -d "$FOLDER" ]; then
            echo "::notice::Subtree folder exists — pulling upstream changes…"
            git subtree pull \
              --prefix="$FOLDER" \
              "$REMOTE_NAME" "$BRANCH" \
              --squash \
              -m "chore: sync agent-framework @ $(date -u +%Y-%m-%d)"
          else
            echo "::notice::Subtree folder not found — performing initial add…"
            git subtree add \
              --prefix="$FOLDER" \
              "$REMOTE_NAME" "$BRANCH" \
              --squash
          fi

      - name: Collapse into a single clean commit without LFS pointers
        run: |
          FOLDER="agent-framework"

          # If there are no new commits beyond origin/main, skip
          if git diff --quiet origin/main..HEAD 2>/dev/null; then
            echo "::notice::No new upstream changes — nothing to clean."
            exit 0
          fi

          # Soft reset to origin/main — all subtree changes become staged
          git reset --soft origin/main

          # Remove LFS pointer files from index and working tree
          find "$FOLDER" -type f | while read -r file; do
            if head -c 50 "$file" 2>/dev/null | grep -q "^version https://git-lfs"; then
              echo "Removing LFS pointer: $file"
              git rm --cached --quiet "$file" 2>/dev/null || true
              rm -f "$file"
            fi
          done

          # Strip filter=lfs lines from all .gitattributes in the subtree
          find "$FOLDER" -name ".gitattributes" | while read -r ga; do
            sed -i '/filter=lfs/d' "$ga"
            sed -i '/diff=lfs/d' "$ga"
            sed -i '/merge=lfs/d' "$ga"
            if [ ! -s "$ga" ]; then
              git rm --cached --quiet "$ga" 2>/dev/null || true
              rm -f "$ga"
            else
              git add "$ga"
            fi
          done

          # Also clean root .gitattributes if affected
          if [ -f .gitattributes ]; then
            sed -i '/filter=lfs/d' .gitattributes
            sed -i '/diff=lfs/d' .gitattributes
            sed -i '/merge=lfs/d' .gitattributes
            git add .gitattributes
          fi

          # Recommit everything as a single clean commit
          git commit -m "chore: sync agent-framework @ $(date -u +%Y-%m-%d) (LFS stripped)"

      - name: Push changes (force to overwrite rewritten history)
        run: |
          if git diff --quiet origin/main..HEAD 2>/dev/null; then
            echo "::notice::No changes to push."
          else
            git push --force-with-lease origin main
          fi
